# mise configuration: https://mise.jdx.dev/configuration.html

[settings]
lockfile = true
use_versions_host = true
lockfile_mode = "merge"
task.run_auto_install = false

[tools]
# 语言运行时与包管理
"core:node" = "26"
"core:python" = "3.14"
"core:go" = "latest"
"aqua:pnpm/pnpm" = "latest"
"aqua:astral-sh/uv" = "latest"
# AI 编程 CLI
"aqua:anthropics/claude-code" = "latest"
"aqua:openai/codex" = "latest"
"aqua:earendil-works/pi" = "latest"
# 代码托管 CLI
"aqua:cli/cli" = "latest"
"gitlab:gitlab-org/cli" = "latest"
# 云工具
"aqua:aws/aws-cli" = "latest"
"github:aliyun/aliyun-cli" = "latest"
"aqua:cloudflare/cloudflared" = "latest"
# 通用工具
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:google/yamlfmt" = "latest"
"aqua:bats-core/bats-core" = "latest"
"aqua:direnv/direnv" = "latest"
"aqua:betterleaks/betterleaks" = "latest"

[env]
DISABLE_AUTOUPDATER = "1"

# 系统应用
[bootstrap.apt.sources.google-chrome]
uris = "https://dl.google.com/linux/chrome/deb/"
suites = "stable"
components = "main"
key = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprint = "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"

[bootstrap.apt.sources.vscode]
uris = "https://packages.microsoft.com/repos/code"
suites = "stable"
components = "main"
key = "https://packages.microsoft.com/keys/microsoft.asc"
fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"

[bootstrap.packages]
"apt:google-chrome-stable" = "latest"
"apt:code" = "latest"
"apt:tmux" = "latest"
"apt:mise" = "latest"

